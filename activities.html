<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>活動查詢｜HIKING</title>
<style>
:root{--ink:#293129;--paper:#f4f0e6;--card:#fffdf7;--line:#d9d2c4;--green:#385f46}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:25px 0 60px}
.top{display:flex;justify-content:space-between;align-items:center}.top a{color:inherit;text-decoration:none}.bear{background:#e8e2d6;border-radius:16px;padding:12px 15px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer}.cover{aspect-ratio:16/8;background:#dfe4dd;display:flex;align-items:center;justify-content:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:15px}h1{font-size:clamp(30px,5vw,52px)}h2{margin:5px 0}.chip{display:inline-block;background:#eee8dc;border-radius:999px;padding:5px 9px;font-size:12px;margin:5px 4px 0 0}.muted{opacity:.68}.empty{padding:24px;background:var(--card);border-radius:16px}@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<div class="top"><b>△ 活動查詢</b><a href="./index.html">← 回首頁</a></div>
<h1>所有活動</h1>
<div class="bear">🐻 此區僅供活動資訊查詢。要參加活動，請回首頁點選「我要報名」。<br><span class="muted">山一直都在，報名入口也一直都在首頁……不用從這裡鑽過去。</span></div>
<div id="list" class="grid"><div class="empty">資料正在走上坡……</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cfg=window.APP_CONFIG||{};const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
async function load(){const {data,error}=await sb.rpc('v23_home_feed');if(error){list.innerHTML='<div class="empty">🐻 活動資料走不動了：'+esc(error.message)+'</div>';return}
const xs=data?.activities||[];list.innerHTML=xs.length?xs.map(a=>`<article class="card" onclick="location.href='./activity.html?slug=${encodeURIComponent(a.slug)}'"><div class="cover">${a.cover_image?`<img src="${esc(a.cover_image)}">`:'🐻 看風景中'}</div><div class="body"><h2>${esc(a.name)}</h2><div>${esc(a.start_date)} — ${esc(a.end_date)}</div><span class="chip">主揪：${esc(a.organizer_name||'未填寫')}</span><span class="chip">👥 ${Number(a.participant_count||0)} / ${Number(a.total_people||0)||'—'}</span><span class="chip">${a.cancelled?'已取消':a.registration_open===false?'已截止':'報名中'}</span><p class="muted">查看活動資料 →</p></div></article>`).join(''):'<div class="empty">🐻 目前沒有活動。山還在，人可能懶了。</div>'}load();
</script></body></html>
