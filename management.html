<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動管理｜HIKING</title>
<style>:root{--ink:#293129;--paper:#f4f0e6;--card:#fffdf7;--line:#d9d2c4;--green:#385f46}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between}.top a{color:inherit;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;background:var(--green);color:white;text-decoration:none;padding:10px 13px;border-radius:11px;font-weight:800}.secondary{background:#e8e2d6;color:var(--ink)}.bear{background:#e8e2d6}</style></head><body><main class="wrap"><div class="top"><b>△ 活動管理</b><a href="./index.html">← 回首頁</a></div><h1>選擇活動</h1><div class="card bear">🐻 報名資料要改這邊，主揪顧團也是這邊。至少門牌終於只有一個。</div><div id="list"><div class="card">讀取活動中……</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const c=window.APP_CONFIG||{};const sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);
async function load(){const {data,error}=await sb.rpc('v23_home_feed');if(error){list.innerHTML='<div class="card">活動讀取失敗。</div>';return}const xs=data?.activities||[];list.innerHTML=xs.length?xs.map(a=>`<div class="card"><h2>${esc(a.name)}</h2><p>${esc(a.start_date)} — ${esc(a.end_date)}　主揪：${esc(a.organizer_name||'未填寫')}</p><div class="actions"><a class="btn" href="./index.html?event=${encodeURIComponent(a.slug)}&recover=1">查看／修改我的報名</a><a class="btn secondary" href="./manage.html?slug=${encodeURIComponent(a.slug)}">主揪管理</a></div></div>`).join(''):'<div class="card">目前沒有活動。</div>'}load();
</script></body></html>
