<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部文章｜HIKING</title>
<style>
:root{--ink:#293129;--paper:#f4f0e6;--card:#fffdf7;--line:#d9d2c4;--green:#385f46}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:26px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.brand{font-weight:900}.back{color:var(--ink);text-decoration:none}h1{font-size:clamp(30px,5vw,54px);margin:6px 0}.muted{opacity:.68}.kicker{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer}
.cover{aspect-ratio:16/8;background:#dfe4dd;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:900}.cover img{width:100%;height:100%;object-fit:cover}
.body{padding:15px}.body h2{font-size:21px;margin:4px 0 7px}.chip{display:inline-block;background:#eee8dc;border-radius:999px;padding:5px 9px;font-size:12px}.empty{padding:24px;background:var(--card);border-radius:16px}
.modal{position:fixed;inset:0;background:rgba(20,25,21,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.panel{background:var(--card);width:min(820px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:20px;position:relative}
.close{position:sticky;top:0;float:right;border:0;border-radius:999px;padding:8px 11px;cursor:pointer}.articleImages{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.articleImages.one{grid-template-columns:1fr}.articleImages img{width:100%;border-radius:14px}.content{white-space:pre-wrap;line-height:1.8}
@media(max-width:680px){.grid{grid-template-columns:1fr}.articleImages{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">△ 登山分享</div><a class="back" href="./index.html">← 回首頁</a></div>
<div class="kicker">Articles</div><h1>全部文章</h1><p class="muted">所有公開文章都在這裡。想看哪篇，自己點；不用在首頁一路滑到人生盡頭。</p>
<div id="list" class="grid"><div class="empty">讀取文章中…</div></div>
</main>
<div id="modal" class="modal"><article class="panel"><button id="close" class="close">✕</button><div id="detail"></div></article></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cfg=window.APP_CONFIG||{};const sb=(cfg.SUPABASE_URL&&cfg.SUPABASE_PUBLISHABLE_KEY)?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY):null;
let posts=[];
function openArticle(i){const x=posts[i];if(!x)return;const imgs=Array.isArray(x.image_urls)?x.image_urls.filter(Boolean):[];
 detail.innerHTML=`<div class="kicker">${esc(x.category||'文章')}</div><h1>${esc(x.title)}</h1>
 ${imgs.length?`<div class="articleImages ${imgs.length===1?'one':''}">${imgs.map(u=>`<img src="${esc(u)}" alt="${esc(x.title)}">`).join('')}</div>`:''}
 ${x.content?`<div class="content">${esc(x.content)}</div>`:'<p class="muted">這篇文章沒有文字內容。</p>'}
 ${x.url?`<p><a href="${esc(x.url)}" target="_blank" rel="noopener">開啟外部連結 ↗</a></p>`:''}`;
 modal.classList.add('open');
}
close.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
async function load(){
 if(!sb){list.innerHTML='<div class="empty">目前無法連線文章資料。</div>';return}
 const {data,error}=await sb.rpc('v22_public_articles');
 if(error){list.innerHTML='<div class="empty">文章讀取失敗：'+esc(error.message)+'</div>';return}
 posts=Array.isArray(data)?data:[];
 list.innerHTML=posts.length?posts.map((x,i)=>{const imgs=Array.isArray(x.image_urls)?x.image_urls.filter(Boolean):[];return `<article class="card" onclick="openArticle(${i})">
 <div class="cover">${imgs[0]?`<img src="${esc(imgs[0])}" alt="${esc(x.title)}">`:'ARTICLE'}</div>
 <div class="body"><span class="chip">${esc(x.category||'其他')}</span><h2>${esc(x.title)}</h2><div class="muted">查看文章 →</div></div></article>`}).join(''):'<div class="empty">目前沒有公開文章。</div>';
}
load();
</script></body></html>
