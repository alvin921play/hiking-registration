<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我要報名｜HIKING</title>
<style>:root{--ink:#293129;--paper:#f4f0e6;--card:#fffdf7;--line:#d9d2c4;--green:#385f46}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between}.top a{color:inherit;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.btn{display:inline-block;background:var(--green);color:white;text-decoration:none;padding:10px 14px;border-radius:11px;font-weight:800}.muted{opacity:.68}.bear{background:#e8e2d6}</style></head><body><main class="wrap"><div class="top"><b>△ 我要報名</b><a href="./index.html">← 回首頁</a></div><h1>選擇活動</h1><div class="card bear">🐻 這裡只處理「新報名」。已經報名過要改資料，請走「活動管理」。</div><div id="list"><div class="card">讀取活動中……</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const c=window.APP_CONFIG||{};const sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);
async function load(){const {data,error}=await sb.rpc('v23_home_feed');if(error){list.innerHTML='<div class="card">活動讀取失敗。</div>';return}const xs=(data?.activities||[]).filter(a=>!a.cancelled&&a.registration_open!==false&&Number(a.participant_count||0)<Number(a.total_people||999999));list.innerHTML=xs.length?xs.map(a=>`<div class="card"><h2>${esc(a.name)}</h2><p>${esc(a.start_date)} — ${esc(a.end_date)}</p><p>主揪：${esc(a.organizer_name||'未填寫')}　👥 ${Number(a.participant_count||0)} / ${Number(a.total_people||0)||'—'}</p><a class="btn" href="./index.html?event=${encodeURIComponent(a.slug)}">我要報名</a></div>`).join(''):'<div class="card">🐻 目前沒有可以報名的活動。</div>'}load();
</script></body></html>
