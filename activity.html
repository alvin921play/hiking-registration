<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動資料｜HIKING</title>
<style>:root{--ink:#293129;--paper:#f4f0e6;--card:#fffdf7;--line:#d9d2c4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{width:min(850px,calc(100% - 28px));margin:auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between}.top a{color:inherit;text-decoration:none}.hero{width:100%;max-height:420px;object-fit:cover;border-radius:20px;margin:18px 0}.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.bear{background:#e8e2d6}.content{white-space:pre-wrap;line-height:1.75}.muted{opacity:.68}</style></head>
<body><main class="wrap"><div class="top"><b>△ 活動資料</b><a href="./activities.html">← 所有活動</a></div><div id="view"><div class="box">資料正在走上坡……</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const slug=new URLSearchParams(location.search).get('slug');const c=window.APP_CONFIG||{};const sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);
async function load(){const {data,error}=await sb.rpc('v23_home_feed');const a=(data?.activities||[]).find(x=>String(x.slug).toUpperCase()===String(slug||'').toUpperCase());if(error||!a){view.innerHTML='<div class="box">🐻 找不到這場活動。熊也不知道它走去哪了。</div>';return}
view.innerHTML=`${a.cover_image?`<img class="hero" src="${esc(a.cover_image)}">`:''}<h1>${esc(a.name)}</h1><div class="box"><b>日期</b><p>${esc(a.start_date)} — ${esc(a.end_date)}</p><b>主揪</b><p>${esc(a.organizer_name||'未填寫')}</p><b>目前人數</b><p>${Number(a.participant_count||0)} / ${Number(a.total_people||0)||'—'}</p></div><div class="box bear">🐻 此頁僅供活動資訊查詢。要參加活動，請回首頁點選「我要報名」。</div>`}load();
</script></body></html>
