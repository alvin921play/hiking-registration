<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登山活動報名系統 v16｜線上測試版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3efe3;--card:#fffdf7;--ink:#17372d;--muted:#6c756f;--line:#c9c4b4;--accent:#244f40;--warn:#8d3f32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:820px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);padding:18px;margin:14px 0}
h1,h2{margin:.2em 0 .6em}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:12px 0}
input,textarea,select,button{width:100%;font:inherit;padding:12px;border:1px solid #64756d;background:#fff}
button{background:var(--accent);color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.secondary{background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.notice{padding:12px;border:1px solid var(--line);background:#f7f4ea;margin:10px 0}
.error{border-color:var(--warn);color:var(--warn)}.ok{border-color:#47725e}.code{font-family:ui-monospace,monospace;word-break:break-all}
@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body><main>
<div class="card">
<h1>🏔️ 登山活動報名系統</h1>
<p class="muted">v16 Supabase 線上連線測試版。先確認「建立活動 → 分享網址 → 另一台裝置報名 → Supabase 收到資料」這條路真的通。</p>
<div id="configWarn" class="notice hidden"></div>
</div>

<section id="home">
<div class="card">
<h2>建立測試活動</h2>
<form id="createForm">
<label>活動名稱<input name="name" required placeholder="例如：戒茂斯上嘉明湖"></label>
<div class="grid">
<label>開始日期<input type="date" name="start" required></label>
<label>結束日期<input type="date" name="end" required></label>
</div>
<div class="grid">
<label>活動總人數<input type="number" min="1" name="total" value="8" required></label>
<label>報名截止<input type="datetime-local" name="cutoff"></label>
</div>
<label>行程內容<textarea name="itinerary" rows="7"></textarea></label>
<label>活動管理密碼<input name="password" type="text" required placeholder="中文也可以"></label>
<button>建立活動</button>
</form>
<div id="createResult"></div>
</div>

<div class="card">
<h2>開啟活動</h2>
<p class="muted">把活動代碼貼進來，或直接使用產生的活動網址。</p>
<form id="openForm"><label>活動代碼<input name="slug" required placeholder="例如：A1B2C3D4"></label><button>開啟活動</button></form>
</div>
</section>

<section id="event" class="hidden">
<button class="secondary" id="back">← 回首頁</button>
<div class="card">
<h2 id="eventName"></h2>
<div id="eventMeta" class="muted"></div>
<div id="eventItinerary" class="notice"></div>
<div id="eventState"></div>
</div>
<div class="card">
<h2>參加者報名</h2>
<form id="regForm">
<label>姓名<input name="name" required></label>
<div class="grid">
<label>出生年月日<input type="date" name="birth" required></label>
<label>性別<select name="gender"><option>男</option><option>女</option><option>其他／不便透露</option></select></label>
</div>
<label>身分證字號<input name="idno" maxlength="10" required placeholder="A123456789"></label>
<label>本人電話<input name="phone" required placeholder="0912345678"></label>
<label>地址<input name="address"></label>
<label>Email<input type="email" name="email"></label>
<div class="grid">
<label>緊急聯絡人<input name="emergency_name" required></label>
<label>關係<input name="emergency_relation"></label>
</div>
<label>緊急聯絡人電話<input name="emergency_phone" required></label>
<label>登山經驗<input name="experience" placeholder="例如：百岳／中級山"></label>
<label>最近三個月登山<textarea name="recent_hikes"></textarea></label>
<label>3000m 以上經驗<input name="high_altitude"></label>
<label>飲食需求<input name="diet"></label>
<div class="grid">
<label>集合方式<select name="transport_type"><option>自行前往</option><option>高鐵</option><option>火車</option><option>指定集合地點</option></select></label>
<label>集合地點<input name="pickup_place"></label>
</div>
<label>備註<textarea name="note"></textarea></label>
<div class="notice">🔒 敏感個資預計於活動結束 60 天後清除。此測試版先驗證跨裝置資料傳輸。</div>
<button>確認送出</button>
</form>
<div id="regResult"></div>
</div>
</section>
</main>
<script src="./config.js"></script>
<script>
const $=s=>document.querySelector(s);
let sb=null,currentSlug=null;

function msg(el,text,ok=false){el.innerHTML=`<div class="notice ${ok?'ok':'error'}">${text}</div>`}
function init(){
 if(!window.APP_CONFIG || !APP_CONFIG.SUPABASE_URL || APP_CONFIG.SUPABASE_URL.includes('貼上')){
   $('#configWarn').classList.remove('hidden');
   msg($('#configWarn'),'尚未設定 Supabase。請先打開 config.js，填入 Project URL 與 Publishable key。');
   return false;
 }
 sb=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_PUBLISHABLE_KEY);
 const slug=new URLSearchParams(location.search).get('event');
 if(slug) loadEvent(slug);
 return true;
}
$('#createForm').addEventListener('submit',async e=>{
 e.preventDefault(); if(!sb && !init())return;
 const f=new FormData(e.target);
 const cutoff=f.get('cutoff') ? new Date(f.get('cutoff')).toISOString() : null;
 const {data,error}=await sb.rpc('create_hiking_activity',{
   p_name:f.get('name'),p_start_date:f.get('start'),p_end_date:f.get('end'),
   p_cutoff_at:cutoff,p_total_people:Number(f.get('total')),p_itinerary:f.get('itinerary'),
   p_admin_password:f.get('password')
 });
 if(error)return msg($('#createResult'),'建立失敗：'+error.message);
 const slug=data?.[0]?.activity_slug;
 const url=location.origin+location.pathname+'?event='+encodeURIComponent(slug);
 msg($('#createResult'),`建立成功。<br>活動代碼：<b class="code">${slug}</b><br>分享網址：<span class="code">${url}</span><br><button type="button" id="copyUrl">複製活動網址</button>`,true);
 $('#copyUrl').onclick=async()=>{await navigator.clipboard.writeText(url);$('#copyUrl').textContent='已複製'};
});
$('#openForm').addEventListener('submit',e=>{e.preventDefault();loadEvent(new FormData(e.target).get('slug'))});
$('#back').onclick=()=>{history.pushState({},'',location.pathname);$('#event').classList.add('hidden');$('#home').classList.remove('hidden')};

async function loadEvent(slug){
 if(!sb && !init())return;
 const {data,error}=await sb.rpc('get_public_activity',{p_slug:String(slug).trim()});
 if(error||!data?.length){alert('找不到活動');return}
 const a=data[0];currentSlug=a.slug;
 $('#eventName').textContent=(a.cancelled?'⛔ ':'')+a.name;
 $('#eventMeta').textContent=`${a.start_date} ～ ${a.end_date}｜活動總人數 ${a.total_people} 人`;
 $('#eventItinerary').textContent=a.itinerary||'尚未填寫行程內容';
 $('#eventState').innerHTML=a.cancelled?'<div class="notice error">⛔ 本活動已取消</div>':(a.registration_open?'<div class="notice ok">目前開放報名</div>':'<div class="notice">目前未開放報名</div>');
 $('#regForm').style.display=(!a.cancelled&&a.registration_open)?'block':'none';
 $('#home').classList.add('hidden');$('#event').classList.remove('hidden');
 history.replaceState({},'',location.pathname+'?event='+encodeURIComponent(a.slug));
}

$('#regForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!currentSlug)return;
 const f=new FormData(e.target);
 const args={
 p_slug:currentSlug,p_name:f.get('name'),p_gender:f.get('gender'),p_birth_date:f.get('birth'),
 p_id_number:f.get('idno'),p_phone:f.get('phone'),p_address:f.get('address'),p_email:f.get('email'),
 p_emergency_name:f.get('emergency_name'),p_emergency_relation:f.get('emergency_relation'),
 p_emergency_phone:f.get('emergency_phone'),p_experience:f.get('experience'),p_recent_hikes:f.get('recent_hikes'),
 p_high_altitude:f.get('high_altitude'),p_diet:f.get('diet'),p_transport_type:f.get('transport_type'),
 p_pickup_place:f.get('pickup_place'),p_note:f.get('note')
 };
 const {data,error}=await sb.rpc('register_participant',args);
 if(error)return msg($('#regResult'),'報名失敗：'+error.message);
 const token=data?.[0]?.edit_token||'';
 msg($('#regResult'),`報名成功。<br>個人修改 Token：<span class="code">${token}</span><br><b>先把這串留著，下一版會接個人修改頁。</b>`,true);
 e.target.reset();
});
init();
</script>
</body></html>
